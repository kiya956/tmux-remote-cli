# Popup listing the remote sessions not yet open here; pick one to attach it
# as a new window.
bind-key -n M-a display-popup -E -w 60% -h 50% -T " Attach remote session " "tmux-remote-pick"
# Attach every unattached session on all known remote hosts for this local
# session, no picker.
bind-key -n M-A display-popup -E -w 60% -h 50% -T " Attach all remote sessions " "tmux-remote-pick --all"
# Detach only the remote session behind the current window and close that
# window (leaves other windows, remotes, and the local session attached).
bind-key -n M-d run-shell "tmux-remote-detach-window '#{session_name}' '#W'"
# Local-only detach (leaves any remote sessions attached).
bind-key D detach-client -s "#{session_name}"
# Detach every remote session opened via tmux-remote, then detach the
# local client. (A bare detach-client only affects the local session; it
# can't reach across the ssh connections into the remote tmux servers.)
bind-key -n M-D run-shell "tmux-remote-detach-all '#{session_name}'"
# Prompt for a name (empty = remote tmux picks one), create a new remote
# session and open it as a new window.
bind-key -n M-n command-prompt -p "New remote session name:" "run-shell \"tmux-remote-new '%1'\""
